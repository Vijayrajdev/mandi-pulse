<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="title desc">
  <title id="title">mandi-pulse</title>
  <desc id="desc">Terminal-style logo for mandi-pulse: a command prompt with a blinking cursor, a live price sparkline and the pipeline collect, spark, delta, dbt, api.</desc>

  <style>
    .mono   { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .spark  { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 6s ease-out infinite; }
    .tip    { opacity: 0; animation: tip 6s ease-out infinite; }

    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    /* draw the line, hold it, fade out, repeat */
    @keyframes draw  { 0% { stroke-dashoffset: 100; opacity: 1; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes tip   { 0%, 33% { opacity: 0; } 38%, 88% { opacity: 1; } 100% { opacity: 0; } }

    /* Respect "reduce motion": show everything, animate nothing */
    @media (prefers-reduced-motion: reduce) {
      .cursor, .spark, .tip { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>

  <defs>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#39FF88"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="1" y="1" width="758" height="198" rx="14" fill="#0A0E0B" stroke="#1C2A21" stroke-width="2"/>
  <rect x="1" y="1" width="758" height="34" rx="14" fill="#101712"/>
  <rect x="1" y="22" width="758" height="13" fill="#101712"/>
  <circle cx="24" cy="18" r="5.5" fill="#FF5F57"/>
  <circle cx="44" cy="18" r="5.5" fill="#FEBC2E"/>
  <circle cx="64" cy="18" r="5.5" fill="#28C840"/>
  <text x="380" y="23" text-anchor="middle" class="mono" font-size="12" fill="#5B6B60">~/mandi-pulse — zsh</text>

  <!-- Live indicator -->
  <g transform="translate(700,18)">
    <circle r="4" fill="#39FF88"/>
    <circle r="4" fill="none" stroke="#39FF88" stroke-width="1.5">
      <animate attributeName="r" values="4;10;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" class="mono" font-size="11" font-weight="700" fill="#39FF88" letter-spacing="1">LIVE</text>
  </g>

  <!-- Prompt + name -->
  <text x="32" y="98" class="mono" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#39FF88">❯</tspan><tspan fill="#E6FFE9" dx="16">mandi</tspan><tspan fill="#39FF88">-pulse</tspan>
  </text>
  <rect class="cursor" x="388" y="62" width="22" height="42" fill="#39FF88"/>

  <!-- Tagline -->
  <text x="34" y="134" class="mono" font-size="17" fill="#9FB3A6">
    <tspan fill="#FEBC2E">₹</tspan> price intelligence for India's mandis
  </text>

  <!-- Pipeline -->
  <text x="34" y="172" class="mono" font-size="14" fill="#4B5D51">
    <tspan fill="#39FF88">$</tspan> collect <tspan fill="#22D3EE">→</tspan> spark <tspan fill="#22D3EE">→</tspan> delta <tspan fill="#22D3EE">→</tspan> dbt <tspan fill="#22D3EE">→</tspan> api
  </text>

  <!-- Sparkline panel -->
  <g transform="translate(470,56)">
    <!-- faint axis grid -->
    <g stroke="#1C2A21" stroke-width="1">
      <line x1="0" y1="20" x2="260" y2="20"/>
      <line x1="0" y1="55" x2="260" y2="55"/>
      <line x1="0" y1="90" x2="260" y2="90"/>
    </g>
    <path class="spark" pathLength="100" filter="url(#glow)"
          d="M0 78 L22 70 L40 74 L58 52 L76 60 L96 40 L114 50 L132 34 L150 46 L170 22 L188 36 L206 28 L226 12 L246 20 L260 6"
          fill="none" stroke="url(#sparkGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="tip">
      <circle cx="260" cy="6" r="4.5" fill="#39FF88" filter="url(#glow)"/>
      <text x="252" y="112" text-anchor="end" class="mono" font-size="12" fill="#39FF88">modal price ▲</text>
    </g>
  </g>
</svg>
