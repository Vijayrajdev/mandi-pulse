# Daily mandi price collection.
# 1. Pull today's prices from data.gov.in -> data/raw/agmarknet/ingest_date=<IST date>/
# 2. Upload records.jsonl + _manifest.json to the Databricks Volume
# 3. Keep a copy as a GitHub artifact (backup if the Databricks upload fails)
#
# Secrets needed (repo Settings -> Secrets and variables -> Actions):
#   DATA_GOV_API_KEY, DATABRICKS_HOST, DATABRICKS_TOKEN

name: Collect daily mandi prices

on:
  schedule:
    # 14:30 UTC = 20:00 IST - late enough for most markets to have reported.
    # GitHub may start scheduled runs a few minutes late; that's fine.
    - cron: "30 14 * * *"
  workflow_dispatch: {} # "Run workflow" button for manual runs

# Never run two collections at the same time (they'd write the same date folder).
concurrency:
  group: collect-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # ~13 pages normally take ~1-2 min; this catches a hung API

    env:
      DATA_DIR: data
      PYTHONUNBUFFERED: "1" # show log lines immediately

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingestion.txt

      - name: Install dependencies
        run: pip install -r requirements-ingestion.txt

      - name: Collect today's prices
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python -m ingestion.collect_daily

      - name: Upload to Databricks Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python -m ingestion.upload_to_volume

      - name: Keep a backup copy as an artifact
        if: always() # also on failure, so the failed manifest can be inspected
        uses: actions/upload-artifact@v4
        with:
          name: raw-agmarknet-${{ github.run_id }}
          path: data/raw/agmarknet/
          retention-days: 30
          if-no-files-found: warn
